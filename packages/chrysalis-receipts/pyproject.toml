[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrysalis-receipts"
version = "0.1.0"
description = "Memory Receipts open standard. Spec, reference verifier, and examples for portable signed credentials of agent epistemic provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Crystal Tubbs", email = "onmybutterflyjourney@gmail.com" }]
keywords = ["ai", "agents", "credentials", "verifiable", "did", "chrysalis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/imago-labs/chrysalis/tree/main/packages/chrysalis-receipts"
Repository = "https://github.com/imago-labs/chrysalis"
Documentation = "https://github.com/imago-labs/chrysalis/blob/main/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["chrysalis_receipts*"]
