[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrysalis-kernel"
version = "0.4.0"
description = "Open kernel for the Chrysalis accountability platform. Memory governance, audit log, and stub interfaces for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Imago Labs", email = "hello@imagolabs.dev" },
]
keywords = ["ai", "agents", "memory", "governance", "observability", "mcp", "solana", "blockchain", "chrysalis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "mcp[cli]>=1.0.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "solana>=0.36.1,<1.0",
  "solders>=0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/imago-labs/chrysalis"
Repository = "https://github.com/imago-labs/chrysalis"
Documentation = "https://github.com/imago-labs/chrysalis/blob/main/ARCHITECTURE.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["packages/memoir-kernel/memoir", "packages/chrysalis-interfaces/chrysalis_interfaces"]
