name: Test and lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e packages/chrysalis-interfaces

      - name: Install dev dependencies
        run: pip install pytest pytest-asyncio ruff

      - name: Lint with ruff
        run: ruff check packages/ tests/

      - name: Run kernel tests
        run: pytest tests/ -v --tb=short

      - name: Run examples to confirm they import cleanly
        run: |
          python -c "from chrysalis_interfaces import RuleBasedCritic, NoOpCoherenceMonitor, NoOpAffectMonitor, LocalLogAttester; print('interfaces OK')"
          python -c "import memoir.core.audit, memoir.models.memory, memoir.conflicts.detector, memoir.provenance.graph; print('kernel OK')"
